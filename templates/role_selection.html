
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Login - Student Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f3f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            color: #17243b;
            font-size: 27px;
            margin-bottom: 12px;
        }

        p {
            color: #65718a;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .login-option {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 18px;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .admin {
            background: #243b55;
        }

        .admin:hover {
            background: #E57373;
            color: white;
        }

        .user {
            background: #243b55;
        }

        .user:hover {
            background: rgb(118, 145, 191);
        }

        .login-option span {
            display: block;
            font-size: 12px;
            font-weight: normal;
            margin-top: 6px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Student Management System</h1>
        <p>Choose your login type</p>

        <a href="{{ url_for('login_page') }}" class="login-option admin">
            Admin Login
            <span>Login as Administrator</span>
        </a>

        <a href="{{ url_for('user_login_page') }}" class="login-option user">
            User Login
            <span>Login as Student</span>
        </a>

    </div>
</body>
</html>
